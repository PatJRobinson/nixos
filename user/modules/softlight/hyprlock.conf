$font_color = rgb(3d2b5a)
background {
    path = screenshot
    blur_passes = 3
}
animations {
    enabled = false
}
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = $font_color
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M"
    color = $font_color
    font_size = 100
    font_family = JetBrainsMono Nerd Font
    position = 0, 230
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 420, 70
    position = 0, 0
    halign = center
    valign = center
    inner_color = rgb(f6f2ee)
    outer_color = rgb(d3c7bb)
    outline_thickness = 1
    font_family = JetBrainsMono Nerd Font
    font_color = $font_color
    placeholder_text = Enter Password 󰈷
    check_color = rgb(396847)
    fail_color = rgb(a5222f)
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>
    rounding = 14
    shadow_passes = 0
    fade_on_empty = false
}
auth {
    fingerprint:enabled = true
}
